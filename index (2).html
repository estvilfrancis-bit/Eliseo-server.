<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Eliseo SERVER</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#eef3f0;--ink:#14231f;--card:#fff;--acc:#2a6f6f;--me:#14231f;--meink:#fff;--line:#cfdcd6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b18;--ink:#e6f2ed;--card:#1a2b27;--acc:#6fc7c0;--me:#6fc7c0;--meink:#0f1b18;--line:#2c443e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;font-weight:700}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.e{color:#c0392b}
#empty{margin:auto;text-align:center;opacity:.7;max-width:280px;line-height:1.5}
form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:0 18px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>
<div id="app">
<header><h1>Eliseo SERVER</h1></header>
<div id="log"><div id="empty">Pregúntame cómo arreglar o hacer root a tu teléfono o computadora.</div></div>
<form id="f"><input id="q" placeholder="Escribe tu mensaje" autocomplete="off" aria-label="Mensaje"><button id="s">Enviar</button></form>
</div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),s=document.getElementById('s');
const hist=[];let busy=false;
function add(cls,t){const d=document.getElementById('empty');if(d)d.remove();const e=document.createElement('div');e.className='m '+cls;e.textContent=t;log.appendChild(e);log.scrollTop=log.scrollHeight;return e}
document.getElementById('f').addEventListener('submit',async ev=>{
 ev.preventDefault();const txt=q.value.trim();if(!txt||busy)return;
 busy=true;s.disabled=true;q.value='';add('u',txt);hist.push({role:'user',content:txt});
 const out=add('b','…');
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||(r.status===429?'Demasiados mensajes seguidos. Espera un momento.':'No se pudo obtener respuesta.'))}
  const reader=r.body.getReader(),dec=new TextDecoder();let full='';
  for(;;){const {done,value}=await reader.read();if(done)break;full+=dec.decode(value,{stream:true});out.textContent=full;log.scrollTop=log.scrollHeight}
  hist.push({role:'assistant',content:full});
 }catch(err){
  hist.pop();out.classList.add('e');out.textContent=err.message||'No se pudo obtener respuesta.';
 }
 busy=false;s.disabled=false;q.focus();
});
</script></body></html>
